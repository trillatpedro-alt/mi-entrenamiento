<style>
  :root{
    /* Industrial Dark Mode */
    --bg-app:#0a0a0a; --bg-card:#121212; --bg-input:#1e1e1e;
    --text-primary:#e0e0e0; --text-secondary:#a0a0a0;
    --accent-primary:#ffffff; --accent-primary-dim:#c9c9c9; --accent-glow:rgba(255,255,255,.16);
    --border-subtle:#333333;
    --red:#ff5c5c;

    /* internal aliases so existing rules below stay wired to the palette above */
    --bg:var(--bg-app); --bg-alt:var(--bg-input); --card:var(--bg-card);
    --text:var(--text-primary); --muted:var(--text-secondary); --border:var(--border-subtle);
    --ink:var(--accent-primary); --on-ink:#0a0a0a;
    --accent:var(--accent-primary); --accent-dark:var(--accent-primary-dim); --accent-soft:var(--accent-glow);
    --green:var(--accent-primary);
    --radius:18px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.7);
    --grad:linear-gradient(135deg,var(--accent-primary),var(--accent-primary-dim));
    color-scheme:dark;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ body{animation:none!important;} }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%, var(--accent-glow), transparent 60%),
      var(--bg-app);
    color:var(--text-primary);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    letter-spacing:-.005em;
    animation:fadeIn .45s ease;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;}
  header.top{
    position:sticky;top:0;z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);
  }
  header.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:-.015em;}
  .icon-btn{
    background:none;border:none;color:var(--text);padding:7px 9px;
    border-radius:10px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;
    transition:background-color .2s ease,border-color .2s ease,transform .15s ease,box-shadow .2s ease;
  }
  .icon-btn:active{background:var(--border);}
  .icon-btn svg{width:19px;height:19px;}
  .chevron{font-size:22px;color:var(--text);}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.02em;background:var(--accent-soft);padding:4px 10px;border-radius:20px;}
  .brand-header{justify-content:space-between;gap:9px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:10px;border-bottom:none;}
  .header-side{width:34px;display:flex;align-items:center;}
  .header-side:last-child{justify-content:flex-end;}
  .brand-center{display:flex;align-items:center;gap:9px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;background:var(--grad);color:var(--on-ink);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;box-shadow:0 4px 14px -4px rgba(0,0,0,.35);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-text{display:flex;flex-direction:column;line-height:1.05;}
  .brand-text b{font-size:13px;font-weight:800;letter-spacing:.08em;}
  .brand-text span{font-size:7.5px;font-weight:600;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
  main{padding:10px 16px 24px;max-width:480px;margin:0 auto;}
  .hero{padding:18px 2px 22px;}
  .hero-greeting{
    font-family:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:30px;font-weight:500;letter-spacing:-.015em;color:var(--text);
  }
  .hero-date{font-size:13px;color:var(--muted);margin-top:4px;}
  .hero-quote{margin-top:16px;}
  .hero-quote p{
    margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:500;
    font-size:16px;line-height:1.45;color:var(--text);text-wrap:balance;
  }
  .hero-quote span{display:block;margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.03em;}
  .hero-quote span::before{content:"— ";}
  .hero-stats{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent-dark);
    margin-top:14px;font-weight:700;background:var(--accent-soft);padding:7px 12px;border-radius:20px;
    border:1px solid color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
    box-shadow:var(--shadow);
    transition:background-color .2s ease,border-color .2s ease,transform .15s ease,box-shadow .2s ease;
  }
  .routine-card{display:flex;align-items:center;gap:10px;}
  .routine-card .info{flex:1;min-width:0;cursor:pointer;}
  .routine-card h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .routine-card .meta{color:var(--muted);font-size:12.5px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .chip{
    font-size:10px;padding:4px 9px;border-radius:20px;color:#fff;font-weight:700;
    white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--grad);color:var(--on-ink);border:none;border-radius:var(--radius-sm);
    padding:13px 16px;font-size:12.5px;font-weight:700;cursor:pointer;
    text-transform:uppercase;letter-spacing:1px;
    box-shadow:0 6px 16px -6px rgba(0,0,0,.5), 0 0 18px -4px var(--accent-glow);
    transition:background-color .2s ease,border-color .2s ease,transform .15s ease,box-shadow .2s ease,filter .15s ease;
  }
  .btn:active{filter:brightness(.92);transform:scale(.98);box-shadow:0 3px 10px -6px rgba(0,0,0,.5);}
  .btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid color-mix(in srgb, var(--red) 40%, transparent);box-shadow:none;}
  .btn.block{width:100%;}
  .btn.small{padding:8px 14px;font-size:11px;border-radius:10px;}
  .btn svg{width:15px;height:15px;}
  .banner{
    background:var(--grad);color:var(--on-ink);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.4);
  }
  .banner b{display:block;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .banner span{font-size:12px;opacity:.9;}
  .section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 9px;font-weight:700;}
  .exercise-card{margin-bottom:12px;}
  .exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .exercise-name{font-size:15px;font-weight:700;cursor:pointer;letter-spacing:-.01em;}
  .exercise-target{color:var(--muted);font-size:12px;margin-top:3px;}
  .note{
    margin-top:9px;font-size:12px;background:var(--accent-soft);color:var(--accent-dark);
    padding:8px 10px;border-radius:var(--radius-sm);border-left:2.5px solid var(--accent);
  }
  .prev{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:9px;}
  .prev span{flex:1;}
  .fill-btn{
    flex-shrink:0;background:var(--bg-alt);border:1px solid var(--border);color:var(--accent);
    border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;cursor:pointer;
    transition:background-color .2s ease,border-color .2s ease,transform .15s ease;
  }
  .pr-badge{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0 28px;}
  .set-row{
    display:grid;grid-template-columns:22px 1fr 1fr 1fr 26px;gap:6px;align-items:center;
    margin-top:8px;
  }
  .set-row .snum{color:var(--muted);font-size:12px;text-align:center;font-weight:600;}
  .set-row input{
    width:100%;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 6px;font-size:16px;color:var(--text);text-align:center;
    transition:background-color .2s ease,border-color .2s ease,transform .15s ease,box-shadow .2s ease;
  }
  .set-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .set-row.done{
    background:rgba(255,255,255,.05);border-radius:var(--radius-sm);
    padding:4px;margin-top:8px;margin-left:-4px;margin-right:-4px;
    transition:background-color .2s ease;
  }
  .set-row.done input{border-color:var(--green);color:var(--text-secondary);}
  .set-row .rm{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .field-labels{
    display:grid;grid-template-columns:22px 1fr 1fr 1fr 26px;gap:6px;margin-top:10px;
    font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;
  }
  .addset{margin-top:10px;background:none;border:1.5px dashed var(--border);color:var(--muted);
    border-radius:var(--radius-sm);padding:9px;width:100%;font-size:11.5px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-weight:600;
    transition:border-color .15s ease, color .15s ease;}
  .addset:active{border-color:var(--accent);color:var(--accent);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .stat{background:var(--bg-alt);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-family:"Fraunces",Georgia,serif;font-weight:600;}
  .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .muscle-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
  .muscle-row:last-child{border-bottom:none;}
  .muscle-row b{font-variant-numeric:tabular-nums;}
  input.ghost{
    background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);
    font-size:16px;padding:5px 0;width:100%;
    transition:background-color .2s ease,border-color .2s ease;
  }
  input.ghost:focus{outline:none;border-bottom-color:var(--accent);}
  input.name-input{font-size:16px;font-weight:700;border-bottom:1px solid var(--border);}
  .ex-edit-card{position:relative;}
  .ex-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ex-edit-grid label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;}

}

function estimate1RM(w,r){ return w*(1+r/30); }
var EQUIV_OBJECTS = [
  {name:"un elefante africano", emoji:"🐘", kg:5400},
  {name:"un rinoceronte", emoji:"🦏", kg:2300},
  {name:"un auto compacto", emoji:"🚗", kg:1200},
  {name:"un piano de cola", emoji:"🎹", kg:350},
  {name:"una motocicleta", emoji:"🏍️", kg:180},
  {name:"un oso panda", emoji:"🐼", kg:100},
  {name:"un refrigerador", emoji:"🧊", kg:80},
  {name:"un perro Golden Retriever", emoji:"🐕", kg:30},
  {name:"una bicicleta", emoji:"🚲", kg:12}
];
function tonnageEquivalence(kg){
  var sorted = EQUIV_OBJECTS.slice().sort(function(a,b){ return b.kg-a.kg; });
  var pick = sorted[sorted.length-1];
  for(var i=0;i<sorted.length;i++){ if(kg >= sorted[i].kg){ pick = sorted[i]; break; } }
  var multiplier = kg / pick.kg;
  var count = multiplier>=10 ? Math.round(multiplier) : (Math.round(multiplier*10)/10);
  return { emoji:pick.emoji, label:pick.name, count:count, text: count+" × "+pick.emoji+" "+pick.name };
}

function computeWrappedStats(session){
  var totalTonnage = 0, totalSets = 0;
  var muscleVolume = {};
  var prs = [];
  session.entries.forEach(function(entry){
    var entryVolume = 0, bestEst = 0, bestW = 0, bestR = 0;
    entry.sets.forEach(function(s){
      var w = parseFloat(s.weight), r = parseFloat(s.reps);
      if(!isNaN(w) && !isNaN(r) && r>0){
        totalSets++;
        var vol = w*r;
        totalTonnage += vol;
        entryVolume += vol;
        var est = estimate1RM(w,r);
        if(est>bestEst){ bestEst=est; bestW=w; bestR=r; }
      }
    });
    if(entryVolume>0) muscleVolume[entry.muscle] = (muscleVolume[entry.muscle]||0) + entryVolume;
    if(entry.name && bestEst>0){
      var baseline = getBestEstimate(entry.name, session.id);
      if(baseline>0 && bestEst>baseline){
        prs.push({name:entry.name, muscle:entry.muscle, weight:bestW, reps:bestR, estBefore:Math.round(baseline), estAfter:Math.round(bestEst)});
      }
    }
  });
  var topMuscle = null;
  Object.keys(muscleVolume).forEach(function(m){
    if(!topMuscle || muscleVolume[m]>topMuscle.volume) topMuscle = {name:m, volume:muscleVolume[m]};
  });
  var tonnage = Math.round(totalTonnage);
  return {
    durationMin: session.durationMin,
    tonnage: tonnage,
    equivalence: tonnageEquivalence(tonnage),
    muscleVolume: muscleVolume,
    topMuscle: topMuscle,
    prs: prs,
    totalSets: totalSets,
    exerciseCount: session.entries.length
  };
}

function getBestEstimate(name, excludeSessionId){
  var best = 0;
  state.sessions.forEach(function(s){
    if(s.id===excludeSessionId) return;
    s.entries.forEach(function(e){
      if(e.name===name){
        e.sets.forEach(function(st){
          var w = parseFloat(st.weight), r = parseFloat(st.reps);
          if(!isNaN(w) && !isNaN(r) && r>0){
            var v = estimate1RM(w,r);
            if(v>best) best = v;
          }
        });
      }
    });
  });
  return best;
}

function normalizeState(parsed){
  if(!parsed || !parsed.routines || !parsed.sessions) return defaultState();
  parsed.view = "home"; parsed.editingRoutine = null;
  parsed.routines.forEach(function(r){ if(!r.days) r.days = []; });

async function fetchClientData(clientId){
  var res = await sb.from("client_data").select("data").eq("client_id", clientId).maybeSingle();
  if(res.error){ console.error("fetchClientData:", res.error.message); return defaultState(); }
  return normalizeState(res.data ? res.data.data : null);
}

function motivationalQuoteOfDay(){
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var diff = now - start;
  var dayOfYear = Math.floor(diff / 86400000);
  var idx = dayOfYear % MOTIVATIONAL_QUOTES.length;
  return MOTIVATIONAL_QUOTES[idx];
}

function greeting(){
  var h = new Date().getHours();
  if(h<12) return "Buenos días";
  if(h<19) return "Buenas tardes";
  return "Buenas noches";
}
function todayLabel(){
  var s = new Date().toLocaleDateString("es-CL",{weekday:"long", day:"numeric", month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function sessionsThisWeek(){
  var now = new Date();
  var day = now.getDay();
  var diffToMonday = (day===0?6:day-1);
  var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-diffToMonday);
  return state.sessions.filter(function(s){ return new Date(s.date) >= monday; }).length;
}
function computeStreak(){
  var daysSet = {};
  state.sessions.forEach(function(s){ daysSet[new Date(s.date).toDateString()] = true; });
  var streak = 0;
  var cursor = new Date();
  if(!daysSet[cursor.toDateString()]) cursor.setDate(cursor.getDate()-1);
  while(daysSet[cursor.toDateString()]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function computeTotals(session){
  var totalSets=0, totalVolume=0, muscle={};
  session.entries.forEach(function(entry){
    var planned = entry.plannedSets || entry.sets.length;
    if(!muscle[entry.muscle]) muscle[entry.muscle] = {done:0, planned:0};
    muscle[entry.muscle].planned += planned;
    entry.sets.forEach(function(s){
      var w = parseFloat(s.weight), r = parseFloat(s.reps);
      if(!isNaN(w) && !isNaN(r) && r>0){
        totalSets++;
        totalVolume += w*r;
        muscle[entry.muscle].done++;
      }
    });
  });
  return {totalSets:totalSets, totalVolume:totalVolume, muscle:muscle};
}

function getLastPerformance(name, excludeId){
  for(var i=0;i<state.sessions.length;i++){
    var s = state.sessions[i];
    if(s.id===excludeId) continue;
    var found = null;
    for(var j=0;j<s.entries.length;j++){ if(s.entries[j].name===name){ found=s.entries[j]; break; } }
    if(found) return {date:s.date, sets:found.sets};
  }
  return null;
}

function startWorkout(routineId){
  var routine = state.routines.find(function(r){return r.id===routineId;});
  if(!routine) return;
  function begin(){
    var session = {
      id: uid(), routineId: routine.id, routineName: routine.name,
      date: new Date().toISOString(), startedAt: Date.now(), finishedAt:null, durationMin:null,
      entries: routine.exercises.map(function(e){
        return {
          exerciseId:e.id, name:e.name, muscle:e.muscle, repRange:e.repRange, rir:e.rir,
          note:e.note||"", noteLabel:e.noteLabel||"", plannedSets:e.sets,
          sets: Array.from({length:e.sets}, function(){ return {weight:"",reps:"",rir:""}; })
        };
      })
    };
    state.activeSession = session;
    state.view = "workout";
    saveState(); render();
  }
  if(state.activeSession){
    showConfirm("Ya existe un entrenamiento en curso (" + state.activeSession.routineName + "). ¿Deseas descartarlo y comenzar uno nuevo?").then(function(ok){
      if(ok) begin();
    });
  } else {
    begin();
  }
}

function finishWorkout(){
  showConfirm("¿Finalizar y registrar este entrenamiento?").then(function(ok){
    if(!ok) return;
    vibrate(50);
    stopRest();
    var session = state.activeSession;
    session.finishedAt = Date.now();
    session.durationMin = Math.max(1, Math.round((session.finishedAt - session.startedAt)/60000));
    var wrapped = computeWrappedStats(session);
    state.sessions.unshift(session);
    state.activeSession = null;
    state.lastSessionId = session.id;
    state.wrappedSessionId = session.id;
    state.wrappedData = wrapped;
    state.view = "wrapped";
    saveState(); render();
  });
}

function cancelWorkout(){
  showConfirm("¿Descartar este entrenamiento sin registrarlo?").then(function(ok){
    if(!ok) return;
    stopRest();
    state.activeSession = null;
    state.view = "home";
    saveState(); render();
  });
}

// ---------- rest timer (independent of main render cycle) ----------

var restState = { active:false, endsAt:0, duration:90 };
var restInterval = null;
var restBarEl, restTimeEl;

function startRest(seconds){
  restState.duration = seconds;
  restState.endsAt = Date.now() + seconds*1000;
  restState.active = true;
  restBarEl.style.display = "flex";
  if(restInterval) clearInterval(restInterval);
  restTick();
  restInterval = setInterval(restTick, 1000);
}
function stopRest(){
  restState.active = false;
  if(restBarEl) restBarEl.style.display = "none";
  if(restInterval){ clearInterval(restInterval); restInterval = null; }
}
function restTick(){
  var remaining = Math.max(0, Math.round((restState.endsAt - Date.now())/1000));
  restTimeEl.textContent = fmtElapsed(remaining*1000);
  if(remaining<=0){
    if(restInterval){ clearInterval(restInterval); restInterval=null; }
    beep();
    setTimeout(stopRest, 1500);
  }
}
function beep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(function(){ o.stop(); ctx.close(); }, 300);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

function buildProgressChart(points, unit, title){
  if(points.length<2) return "";
  unit = unit===undefined ? "kg" : unit;
  title = title || "Progreso (peso máximo por sesión)";
  var w=311, h=110, padX=8, padY=16;
  var vals = points.map(function(p){return p.value;});
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min===max){ min = min-1; max = max+1; }
  var stepX = (w-padX*2)/(points.length-1);
  function y(v){ return h-padY - ((v-min)/(max-min))*(h-padY*2); }
  var linePts = points.map(function(p,i){ return (padX+i*stepX).toFixed(1)+","+y(p.value).toFixed(1); }).join(" ");
  var dots = points.map(function(p,i){
    var x=(padX+i*stepX).toFixed(1), yy=y(p.value).toFixed(1);
    return '<circle cx="'+x+'" cy="'+yy+'" r="3" style="fill:var(--accent)"/>';
  }).join("");
  var lastX = padX+(points.length-1)*stepX;
  var lastY = y(points[points.length-1].value);
  var lastVal = points[points.length-1].value;
  var lastText = (Math.round(lastVal*10)/10)+unit;
  var lastLabel = '<text x="'+lastX+'" y="'+(lastY-8)+'" font-size="11" style="fill:var(--accent)" text-anchor="end" font-weight="700">'+lastText+'</text>';
  return '<div class="card"><div class="section-title" style="margin-top:0;">'+title+'</div>' +
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;overflow:visible;">' +
      '<line x1="'+padX+'" y1="'+(h-padY)+'" x2="'+(w-padX)+'" y2="'+(h-padY)+'" style="stroke:var(--border)" stroke-width="1"/>' +
      '<polyline points="'+linePts+'" fill="none" style="stroke:var(--accent)" stroke-width="2"/>' +
      dots + lastLabel +
    '</svg></div>';
}

function renderExerciseProgress(name){
  var rows = [];
  var chartPoints = [];
  var chronological = state.sessions.slice().reverse();
  chronological.forEach(function(s){
    var e = s.entries.find(function(en){ return en.name===name; });
    if(e){
      var best = 0;
      e.sets.forEach(function(st){ var w=parseFloat(st.weight); if(!isNaN(w) && w>best) best=w; });
      if(best>0) chartPoints.push({date:s.date, value:best});
    }
  });
  state.sessions.forEach(function(s){
    s.entries.forEach(function(e){
      if(e.name===name) rows.push({date:s.date, sets:e.sets});
    });
  });
  if(state.activeSession){
    state.activeSession.entries.forEach(function(e){
      if(e.name===name) rows.unshift({date:state.activeSession.date, sets:e.sets, current:true});
    });
  }
  var chartHtml = buildProgressChart(chartPoints);
  if(rows.length===0) return chartHtml + '<div class="empty">Sin historial registrado para '+name+'.</div>';
  var list = rows.map(function(r){
    var setsHtml = r.sets.filter(function(s){return s.weight!==""||s.reps!=="";}).map(function(s){
      return '<div class="muscle-row"><span>'+(s.weight||"–")+' kg × '+(s.reps||"–")+' reps</span><b>'+(s.rir!==""&&s.rir!==undefined?"@"+s.rir:"")+'</b></div>';

  }).join("");
  return chartHtml + list;
}

function buildWrappedCanvas(session, wrapped){
  return new Promise(function(resolve){
    try{
      var W = 1080;
      var canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = 1200;
      var ctx = canvas.getContext("2d");
      ctx.textAlign = "center";

      // ---- pass 1: figure out how tall the content actually is ----
      ctx.font = "500 36px Manrope, sans-serif";
      var eqText = "Equivale a levantar "+wrapped.equivalence.text;
      var eqLineCount = measureWrapLineCount(ctx, eqText, 860);
      var prList = wrapped.prs.slice(0,4);

      var topPad = 110, bottomPad = 130;
      var cursor = topPad;
      cursor += 46;  // brand line
      cursor += 90;  // routine title
      cursor += 60;  // date
      cursor += 60;  // gap before first stat
      cursor += 230; // duration stat block
      cursor += 230; // tonnage stat block
      cursor += eqLineCount*48 + 40; // equivalence text
      if(wrapped.topMuscle){ cursor += 230; }
      if(prList.length){ cursor += 60 + prList.length*50 + 20; }
      var H = Math.max(cursor + bottomPad, 1200);

      canvas.height = H;
      ctx.textAlign = "center"; // context resets on resize

      // ---- pass 2: actually draw, using the same layout ----
      var bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,"#121212"); bg.addColorStop(1,"#0a0a0a");
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      var glow = ctx.createRadialGradient(W/2,topPad+200,50,W/2,topPad+200,760);
      glow.addColorStop(0,"rgba(255,255,255,.18)"); glow.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

      var y = topPad;
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 34px Manrope, sans-serif";
      ctx.fillText("TRILLAT COACHING", W/2, y);

      y += 90;
      ctx.fillStyle = "#e0e0e0";
      ctx.font = "600 60px Fraunces, Georgia, serif";
      ctx.fillText(session.routineName, W/2, y);

      y += 50;
      ctx.font = "500 30px Manrope, sans-serif";
      ctx.fillStyle = "#a0a0a0";
      ctx.fillText(fmtDate(session.date), W/2, y);

      y += 60;
      function statBlock(label, value){
        y += 108;
        ctx.font = "800 108px Fraunces, Georgia, serif";
        ctx.fillStyle = "#e0e0e0";
        ctx.fillText(value, W/2, y);
        y += 48;
        ctx.font = "700 30px Manrope, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label.toUpperCase(), W/2, y);
        y += 74;
      }
      statBlock("Minutos entrenados", (wrapped.durationMin||0)+"");
      statBlock("Kg totales levantados", wrapped.tonnage.toLocaleString());

      ctx.font = "500 36px Manrope, sans-serif";
      ctx.fillStyle = "#e0e0e0";
      y += 44;
      drawWrapLines(ctx, eqText, W/2, y, 860, 48);
      y += eqLineCount*48 + 40;

      if(wrapped.topMuscle){
        statBlock("Grupo protagonista", wrapped.topMuscle.name);
      }

      if(prList.length){
        y += 20;
        ctx.font = "700 40px Manrope, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("★ "+wrapped.prs.length+" récord"+(wrapped.prs.length>1?"s":"")+" personal"+(wrapped.prs.length>1?"es":""), W/2, y);
        ctx.font = "500 34px Manrope, sans-serif";
        ctx.fillStyle = "#e0e0e0";
        prList.forEach(function(pr){
          y += 50;
          ctx.fillText(pr.name+" · "+pr.weight+"kg×"+pr.reps, W/2, y);
        });
      }

      ctx.font = "600 26px Manrope, sans-serif";
      ctx.fillStyle = "#a0a0a0";
      ctx.fillText("Mi Entrenamiento", W/2, H-60);

      canvas.toBlob(function(blob){ resolve(blob); }, "image/png");
    }catch(e){ resolve(null); }
  });
}

function measureWrapLineCount(ctx, text, maxWidth){
  var words = text.split(" ");
  var line = "", count = 0;
  words.forEach(function(w){
    var test = line ? line+" "+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ count++; line = w; }
    else line = test;
  });
  return count+1;
}
function drawWrapLines(ctx, text, x, y, maxWidth, lineHeight){
  var words = text.split(" ");
  var line = "", lines = [];
  words.forEach(function(w){
    var test = line ? line+" "+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  });
  lines.push(line);
  lines.forEach(function(l,i){ ctx.fillText(l, x, y+i*lineHeight); });
}

function shareWrappedFor(session, wrapped){
  var summaryText = "💪 "+session.routineName+" — "+fmtDate(session.date)+"\n" +
    "⏱ "+(wrapped.durationMin||0)+" min · 🏋️ "+wrapped.tonnage.toLocaleString()+" kg levantados\n" +
    "Equivale a levantar "+wrapped.equivalence.text+"\n" +
    (wrapped.topMuscle ? "🎯 Protagonista: "+wrapped.topMuscle.name+"\n" : "") +
    (wrapped.prs.length ? "★ "+wrapped.prs.length+" récord(s) personal(es)\n" : "");

  buildWrappedCanvas(session, wrapped).then(function(blob){
    var shareData = { title:"Mi entrenamiento", text: summaryText };
    if(blob && window.File && navigator.canShare){
      try{
        var file = new File([blob], "entrenamiento.png", {type:"image/png"});
        if(navigator.canShare({files:[file]})) shareData.files = [file];
      }catch(e){}
    }
    if(navigator.share){
      navigator.share(shareData).catch(function(){});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(summaryText).then(function(){ showAlert("Resumen copiado al portapapeles."); });
    } else {
      showAlert(summaryText);
    }
  });
}

    left = '<button class="icon-btn chevron" data-action="goto" data-view="home">‹</button>';
  } else if(view==="routinePreview"){
    var pr = state.routines.find(function(x){return x.id===state.previewRoutineId;});
    title = pr ? pr.name : "Rutina";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="home">‹</button>';
    right = '<button class="icon-btn" data-action="edit-routine" data-routine="'+state.previewRoutineId+'">'+icon('edit')+'</button>';
  } else if(view==="data"){
    title = "Datos";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="home">‹</button>';
  }
  else if(view==="wrapped"){ return ""; }
  return '<header class="top">'+left+'<h1>'+title+'</h1>'+right+'</header>';
}

function bottomNavFor(view){
  var active = (view==="home"||view==="editRoutine"||view==="routinePreview") ? "home" : (view==="checkin") ? "checkin" : (view==="history"||view==="sessionDetail"||view==="exerciseProgress") ? "history" : "";
  function cls(v){ return v===active ? "active" : ""; }
  if(view==="workout" || view==="sessionSummary" || view==="routinePreview" || view==="wrapped") return "";
  return '<nav class="bottom">' +
    '<button class="'+cls("home")+'" data-action="goto" data-view="home">'+icon('dumbbell')+'Rutinas</button>' +
    '<button class="'+cls("checkin")+'" data-action="goto" data-view="checkin">'+icon('checkin')+'Check-in</button>' +
    '<button class="'+cls("history")+'" data-action="goto" data-view="history">'+icon('history')+'Historial</button>' +
  '</nav>';
}

function render(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  var body = "";
  switch(state.view){
    case "home": body = renderHome(); break;
    case "workout": body = renderWorkout(); break;
    case "history": body = renderHistory(); break;
    case "sessionDetail":
      var sd = state.sessions.find(function(s){return s.id===state.viewingSession;});
      body = sd ? renderSessionDetail(sd,false) : '<div class="empty">No encontrado.</div>';
      break;
    case "sessionSummary":
      var ss = state.sessions.find(function(s){return s.id===state.lastSessionId;});
      body = ss ? renderSessionDetail(ss,true) : '<div class="empty">No encontrado.</div>';
      break;
    case "exerciseProgress": body = renderExerciseProgress(decodeURIComponent(state.progressExercise||"")); break;
    case "editRoutine": body = renderEditRoutine(state.editingRoutine); break;
    case "routinePreview": body = renderRoutinePreview(state.previewRoutineId); break;
    case "data": body = renderData(); break;
    case "checkin": body = renderCheckin(); break;
    case "wrapped": body = renderWrapped(); break;
    default: body = renderHome();
  }
  document.getElementById("app").innerHTML = headerFor(state.view) + "<main>" + body + "</main>" + bottomNavFor(state.view);
  if(state.view!=="workout") stopRest();
  if(state.view==="workout" && state.activeSession){
    var disp = document.getElementById("timerDisplay");
    function tick(){ if(disp) disp.textContent = fmtElapsed(Date.now()-state.activeSession.startedAt); }
    tick();
    timerInterval = setInterval(tick, 1000);
  }
}

// ---------- event delegation ----------

var app = document.getElementById("app");

app.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.dataset.action;

  if(action==="goto"){
    var v = t.dataset.view;
    if(v==="back"){ state.view = state.activeSession ? "workout" : "history"; }
    else state.view = v;
    if(v==="checkin") initCheckinDraft();
    render(); return;
  }
  if(action==="start-workout"){ startWorkout(t.dataset.routine); return; }
  if(action==="finish-workout"){ finishWorkout(); return; }
  if(action==="share-wrapped"){ shareWrapped(); return; }
  if(action==="share-session"){ shareSession(t.dataset.session); return; }
  if(action==="cancel-workout"){ cancelWorkout(); return; }
  if(action==="add-set"){
    var idx = +t.dataset.entry;
    state.activeSession.entries[idx].sets.push({weight:"",reps:"",rir:""});
    saveState(); render(); return;
  }
  if(action==="remove-set"){
    var ei=+t.dataset.entry, si=+t.dataset.set;
    state.activeSession.entries[ei].sets.splice(si,1);
    if(state.activeSession.entries[ei].sets.length===0) state.activeSession.entries[ei].sets.push({weight:"",reps:"",rir:""});
    saveState(); render(); return;
  }
  if(action==="fill-previous"){
    var fi = +t.dataset.entry;
    var entry = state.activeSession.entries[fi];
    var prev = getLastPerformance(entry.name, state.activeSession.id);
    if(prev){
      entry.sets = prev.sets.map(function(s){ return {weight:s.weight, reps:s.reps, rir:s.rir}; });
      entry.plannedSets = Math.max(entry.plannedSets, entry.sets.length);
    }
    saveState(); render(); return;
  }
  if(action==="add-exercise"){
    vibrate(50);
    state.activeSession.entries.push({exerciseId:uid(),name:"",muscle:"General",repRange:"",rir:"",note:"",noteLabel:"",plannedSets:3,sets:[{weight:"",reps:"",rir:""},{weight:"",reps:"",rir:""},{weight:"",reps:"",rir:""}]});
    saveState(); render(); return;
  }
  if(action==="view-progress"){
    state.progressExercise = t.dataset.name;
    state.view = "exerciseProgress";
    render(); return;
  }
  if(action==="view-session"){
    state.viewingSession = t.dataset.session;
    state.view = "sessionDetail";
    render(); return;
  }
  if(action==="delete-session"){
    showConfirm("¿Eliminar este entrenamiento del historial?").then(function(ok){
      if(!ok) return;
      state.sessions = state.sessions.filter(function(s){return s.id!==t.dataset.session;});
      state.view = "history";
      saveState(); render();
    });
    return;
  }
  if(action==="edit-routine"){
    state.editingRoutine = t.dataset.routine;
    state.view = "editRoutine";
    render(); return;
  }
  if(action==="preview-routine"){
    state.previewRoutineId = t.dataset.routine;
    state.view = "routinePreview";
    render(); return;
  }
  if(action==="toggle-day"){
    var day = +t.dataset.day;
    var routine3 = state.routines.find(function(r){return r.id===t.dataset.routine;});
    if(!routine3.days) routine3.days = [];
    var dpos = routine3.days.indexOf(day);
    if(dpos>=0) routine3.days.splice(dpos,1); else routine3.days.push(day);
    saveState(); render(); return;
  }
  if(action==="add-routine"){
    var nr = {id:uid(), name:"Nueva rutina", days:[], exercises:[]};
    state.routines.push(nr);
    state.editingRoutine = nr.id;
    state.view = "editRoutine";
    saveState(); render(); return;
  }
  if(action==="remove-routine"){
    showConfirm("¿Eliminar esta rutina completa?").then(function(ok){
      if(!ok) return;
      state.routines = state.routines.filter(function(r){return r.id!==t.dataset.routine;});
      state.view = "home";
      saveState(); render();
    });
    return;
  }
  if(action==="add-exercise-to-routine"){
    vibrate([30,50,30]);
    var routine = state.routines.find(function(r){return r.id===t.dataset.routine;});
    routine.exercises.push({id:uid(),name:"",muscle:"General",sets:3,repRange:"10-12",rir:2,note:"",noteLabel:""});
    saveState(); render(); return;
  }
  if(action==="remove-exercise"){
    var routine2 = state.routines.find(function(r){return r.id===t.dataset.routine;});
    routine2.exercises = routine2.exercises.filter(function(e){return e.id!==t.dataset.exercise;});
    saveState(); render(); return;
  }
  if(action==="save-checkin"){
    vibrate(50);
    saveCheckin();
    render();
    return;
  }
  if(action==="set-checkin-metric"){
    state.checkinChartMetric = t.dataset.metric;
    render(); return;
  }
  if(action==="delete-checkin"){
    showConfirm("¿Eliminar este check-in?").then(function(ok){
      if(!ok) return;
      state.checkins = state.checkins.filter(function(c){return c.id!==t.dataset.checkin;});
      saveState(); render();
    });
    return;
  }
  if(action==="ack-note"){
    var noteId = t.dataset.note;
    sb.from("coach_notes").update({read_at:new Date().toISOString()}).eq("id", noteId).then(function(){
      coachNotesCache = coachNotesCache.filter(function(n){ return n.id!==noteId; });
      render();
    });
    return;
  }
  if(action==="import-local"){
    var localBackup = loadLocalBackup();
    if(!localBackup) return;
    showConfirm("Esto reemplazará los datos de tu cuenta con los que ya tenías guardados en este celular. ¿Continuar?").then(function(ok){
      if(!ok) return;
      state = normalizeState(localBackup);
      saveState(); render();
      showAlert("Datos importados y sincronizados con tu cuenta.");
    });
    return;
  }
  if(action==="copy-invite"){
    var link = t.dataset.invite;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){ showAlert("Link copiado. Envíaselo a tu cliente."); });
    } else {
      showAlert(link);
    }
    return;
  }
  if(action==="sign-out"){
    showConfirm("¿Cerrar sesión?").then(function(ok){
      if(!ok) return;
      sb.auth.signOut().then(function(){ location.reload(); });
    });
    return;
  }
  if(action==="export-data"){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "entrenamiento-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return;
  }
  if(action==="import-data"){
    document.getElementById("importFile").click();
    return;
  }
});

app.addEventListener("input", function(e){
  var t = e.target;
  var role = t.dataset.role;
  if(!role) return;

  if(role==="checkin-weight"){ state.checkinDraft.weight = t.value; saveState(); return; }
  if(role==="checkin-sleep"){ state.checkinDraft.sleepHours = t.value; saveState(); return; }
  if(role==="checkin-scale"){
    var metric = t.dataset.metric;
    state.checkinDraft[metric] = t.value;
    var label = document.getElementById("checkinVal-"+metric);
    if(label) label.textContent = t.value;
    saveState(); return;
  }
  if(role==="set-weight" || role==="set-reps" || role==="set-rir"){
    var ei=+t.dataset.entry, si=+t.dataset.set;
    var field = role==="set-weight"?"weight":role==="set-reps"?"reps":"rir";
    var entry = state.activeSession.entries[ei];
    entry.sets[si][field] = t.value;
    var row = t.closest(".set-row");
    var set = entry.sets[si];
    var wasDone = row.classList.contains("done");
    row.classList.toggle("done", set.weight!=="" && set.reps!=="");
    if(!wasDone && row.classList.contains("done")){ vibrate(30); startRest(restState.duration); }
    var pw = parseFloat(set.weight), pr = parseFloat(set.reps);
    var baseline = entry.name ? getBestEstimate(entry.name, state.activeSession.id) : 0;
    var isPR = baseline>0 && !isNaN(pw) && !isNaN(pr) && pr>0 && estimate1RM(pw,pr) > baseline;
    var nextEl = row.nextElementSibling;
    var hasBadge = nextEl && nextEl.classList && nextEl.classList.contains("pr-badge");
    if(isPR && !hasBadge){
      var badge = document.createElement("div");
      badge.className = "pr-badge";
      badge.textContent = "★ Récord personal";
      row.insertAdjacentElement("afterend", badge);
    } else if(!isPR && hasBadge){
      nextEl.remove();
    }
    saveState(); return;
  }
  if(role==="entry-name"){ state.activeSession.entries[+t.dataset.entry].name = t.value; saveState(); return; }
  if(role==="entry-muscle"){ state.activeSession.entries[+t.dataset.entry].muscle = t.value || "General"; saveState(); return; }

  if(role==="routine-name"){
    var r = state.routines.find(function(x){return x.id===t.dataset.routine;});
    r.name = t.value; saveState(); return;
  }
  if(role && role.indexOf("ex-")===0){
    var r2 = state.routines.find(function(x){return x.id===t.dataset.routine;});
    var e2 = r2.exercises.find(function(x){return x.id===t.dataset.exercise;});
    if(role==="ex-name") e2.name = t.value;
    else if(role==="ex-muscle") e2.muscle = t.value || "General";
    else if(role==="ex-sets") e2.sets = Math.max(1, parseInt(t.value)||1);
    else if(role==="ex-reprange") e2.repRange = t.value;
    else if(role==="ex-rir") e2.rir = t.value;
    else if(role==="ex-note") e2.note = t.value;
    saveState(); return;
  }
});

document.getElementById("importFile").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var parsed;
    try{
      parsed = JSON.parse(ev.target.result);
      if(!parsed.routines || !parsed.sessions) throw new Error("formato inválido");
    }catch(err){
      showAlert("No se pudo leer el archivo. Verifica que sea un respaldo válido.");
      return;
    }
    showConfirm("Esto reemplazará todos tus datos actuales con los del archivo. ¿Continuar?").then(function(ok){
      if(!ok) return;
      state = parsed;
      state.view = "home"; state.editingRoutine = null; state.activeSession = state.activeSession || null;
      state.routines.forEach(function(r){ if(!r.days) r.days = []; });
      saveState(); render();
      showAlert("Datos importados correctamente.");
    });
  };
  reader.readAsText(file);
  e.target.value = "";
});

var dialogOverlayEl = document.getElementById("dialogOverlay");
var dialogMessageEl = document.getElementById("dialogMessage");
var dialogOkBtn = document.getElementById("dialogOkBtn");
var dialogCancelBtn = document.getElementById("dialogCancelBtn");

function showConfirm(message){
  return new Promise(function(resolve){
    dialogMessageEl.textContent = message;
    dialogCancelBtn.style.display = "inline-flex";
    dialogOverlayEl.style.display = "flex";
    function cleanup(result){
      dialogOverlayEl.style.display = "none";
      dialogOkBtn.removeEventListener("click", onOk);
      dialogCancelBtn.removeEventListener("click", onCancel);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    dialogOkBtn.addEventListener("click", onOk);
    dialogCancelBtn.addEventListener("click", onCancel);
  });
}
function showAlert(message){
  return new Promise(function(resolve){
    dialogMessageEl.textContent = message;
    dialogCancelBtn.style.display = "none";
    dialogOverlayEl.style.display = "flex";
    function cleanup(){
      dialogOverlayEl.style.display = "none";
      dialogOkBtn.removeEventListener("click", onOk);
      resolve();
    }
    function onOk(){ cleanup(); }
    dialogOkBtn.addEventListener("click", onOk);
  });
}

restBarEl = document.getElementById("restBar");
restTimeEl = document.getElementById("restTimeDisplay");
document.getElementById("restExtendBtn").addEventListener("click", function(){ restState.endsAt += 15000; restTick(); });
document.getElementById("restSkipBtn").addEventListener("click", stopRest);

// ---------- autenticación ----------

var authScreenEl = document.getElementById("authScreen");
var authMode = "login";

function generateInviteCode(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var code = "";
  for(var i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function showAuthError(msg){ document.getElementById("authError").textContent = msg || ""; }

function setAuthMode(mode){
  authMode = mode;
  document.getElementById("authTabLogin").classList.toggle("active", mode==="login");
  document.getElementById("authTabSignup").classList.toggle("active", mode==="signup");
  document.getElementById("authSignupExtra").style.display = mode==="signup" ? "block" : "none";
  document.getElementById("authSubmitBtn").textContent = mode==="signup" ? "Crear cuenta" : "Iniciar sesión";
  showAuthError("");
}

function showAuthScreen(){
  authScreenEl.style.display = "flex";
}
function showApp(){
  authScreenEl.style.display = "none";
}

async function fetchCoachNotes(){
  if(!currentUser) return;
  var res = await sb.from("coach_notes").select("*").eq("client_id", currentUser.id).order("created_at",{ascending:false});
  coachNotesCache = res.error ? [] : (res.data || []);
}

async function loadCurrentUserAndData(user){
  var profRes = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(profRes.error || !profRes.data){
    showAuthError("No se pudo cargar tu perfil. Intenta iniciar sesión de nuevo.");
    await sb.auth.signOut();
    showAuthScreen();
    return;
  }
  currentUser = profRes.data;
  state = await fetchClientData(currentUser.id);
  await fetchCoachNotes();
  showApp();
  render();
}

async function handleLogin(email, password){
  var res = await sb.auth.signInWithPassword({ email:email, password:password });
  if(res.error){ showAuthError("No pudimos iniciar sesión: revisa tu correo y contraseña."); return; }
  await loadCurrentUserAndData(res.data.user);
}

async function handleSignup(email, password, inviteCode, isCoach){
  var signUpRes = await sb.auth.signUp({ email:email, password:password });
  if(signUpRes.error){ showAuthError(signUpRes.error.message); return; }
  var user = signUpRes.data.user;
  if(!user || !signUpRes.data.session){
    showAuthError("Revisa tu correo para confirmar la cuenta y luego inicia sesión.");
    return;
  }
  var role = "client", coachId = null, myInviteCode = null;
  if(isCoach){
    role = "coach";
    myInviteCode = generateInviteCode();
  } else if(inviteCode){
    var coachRes = await sb.from("profiles").select("id").eq("invite_code", inviteCode.trim().toUpperCase()).eq("role","coach").maybeSingle();
    if(coachRes.error || !coachRes.data){ showAuthError("Código de invitación inválido."); return; }
    coachId = coachRes.data.id;
  }
  var insertRes = await sb.from("profiles").insert({
    id:user.id, role:role, coach_id:coachId, invite_code:myInviteCode, display_name: email.split("@")[0]
  });
  if(insertRes.error){ showAuthError(insertRes.error.message); return; }
  await loadCurrentUserAndData(user);
}

function onAuthSubmit(){
  if(!sb){ showAuthError("No se pudo conectar. Revisa tu conexión a internet."); return; }
  var email = document.getElementById("authEmail").value.trim();
  var password = document.getElementById("authPassword").value;
  if(!email || !password){ showAuthError("Completa correo y contraseña."); return; }
  var btn = document.getElementById("authSubmitBtn");
  btn.disabled = true;
  showAuthError("");
  var task = authMode==="login"
    ? handleLogin(email, password)
    : handleSignup(email, password, document.getElementById("authInvite").value.trim(), document.getElementById("authIsCoach").checked);
  task.catch(function(e){ showAuthError("Ocurrió un error inesperado."); console.error(e); })
    .then(function(){ btn.disabled = false; });
}

document.getElementById("authTabLogin").addEventListener("click", function(){ setAuthMode("login"); });
document.getElementById("authTabSignup").addEventListener("click", function(){ setAuthMode("signup"); });
document.getElementById("authSubmitBtn").addEventListener("click", onAuthSubmit);
document.getElementById("authIsCoach").addEventListener("change", function(e){
  document.getElementById("authInviteRow").style.display = e.target.checked ? "none" : "block";
});

var inviteFromUrl = new URLSearchParams(location.search).get("invite");
if(inviteFromUrl){
  setAuthMode("signup");
  document.getElementById("authInvite").value = inviteFromUrl;
}

async function initApp(){
  if(!sb){
    showAuthScreen();
    showAuthError("No se pudo conectar. Revisa tu conexión a internet y vuelve a intentar.");
    return;
  }
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data.session;
  if(!session){ showAuthScreen(); return; }
  await loadCurrentUserAndData(session.user);
}

initApp();
})();
