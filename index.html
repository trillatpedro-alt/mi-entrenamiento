<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --text:#18191b; --muted:#6b6e74; --border:#e3e3e0;
    --accent:#a8631f; --accent-dark:#824c17; --green:#1f7a5c; --red:#a6403c;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111214; --card:#1a1b1e; --text:#f1f1ef; --muted:#9a9ca1; --border:#2b2c30; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;}
  header.top{
    position:sticky;top:0;z-index:10;background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);
  }
  header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;}
  .icon-btn{
    background:none;border:none;color:var(--text);padding:6px 8px;
    border-radius:8px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;
  }
  .icon-btn:active{background:var(--border);}
  .icon-btn svg{width:20px;height:20px;}
  .chevron{font-size:22px;color:var(--text);}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.02em;}
  main{padding:14px 16px 24px;max-width:480px;margin:0 auto;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;
  }
  .routine-card{display:flex;align-items:center;gap:10px;}
  .routine-card .info{flex:1;min-width:0;}
  .routine-card h3{margin:0 0 4px;font-size:16px;font-weight:700;}
  .routine-card .meta{color:var(--muted);font-size:12.5px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{
    font-size:10px;padding:3px 7px;border-radius:4px;color:#fff;font-weight:700;
    white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;
    text-transform:uppercase;letter-spacing:.04em;
  }
  .btn:active{background:var(--accent-dark);}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.block{width:100%;}
  .btn.small{padding:7px 12px;font-size:11.5px;}
  .btn svg{width:15px;height:15px;}
  .banner{
    background:var(--accent);color:#fff;border-radius:var(--radius);
    padding:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .banner b{display:block;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .banner span{font-size:12px;opacity:.9;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:700;}
  .exercise-card{margin-bottom:12px;}
  .exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .exercise-name{font-size:15px;font-weight:700;cursor:pointer;}
  .exercise-target{color:var(--muted);font-size:12px;margin-top:2px;}
  .note{
    margin-top:8px;font-size:12px;background:rgba(168,99,31,.1);color:var(--accent-dark);
    padding:6px 8px;border-radius:6px;border-left:2px solid var(--accent);
  }
  @media (prefers-color-scheme: dark){ .note{color:#dba977;} }
  .prev{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:8px;}
  .prev span{flex:1;}
  .fill-btn{
    flex-shrink:0;background:none;border:1px solid var(--border);color:var(--accent);
    border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;cursor:pointer;
  }
  .pr-badge{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:3px 0 0 28px;}
  .set-row{
    display:grid;grid-template-columns:22px 1fr 1fr 1fr 26px;gap:6px;align-items:center;
    margin-top:8px;
  }
  .set-row .snum{color:var(--muted);font-size:12px;text-align:center;font-weight:600;}
  .set-row input{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    padding:8px 6px;font-size:14px;color:var(--text);text-align:center;
  }
  .set-row.done input{border-color:var(--green);}
  .set-row .rm{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .field-labels{
    display:grid;grid-template-columns:22px 1fr 1fr 1fr 26px;gap:6px;margin-top:10px;
    font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;
  }
  .addset{margin-top:10px;background:none;border:1px dashed var(--border);color:var(--muted);
    border-radius:6px;padding:7px;width:100%;font-size:11.5px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .stat{background:var(--bg);border-radius:8px;padding:10px;text-align:center;}
  .stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;}
  .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .muscle-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
  .muscle-row:last-child{border-bottom:none;}
  .muscle-row b{font-variant-numeric:tabular-nums;}
  input.ghost{
    background:transparent;border:none;border-bottom:1px dashed var(--border);color:var(--text);
    font-size:14px;padding:4px 0;width:100%;
  }
  input.name-input{font-size:15px;font-weight:700;border-bottom:1px solid var(--border);}
  .ex-edit-card{position:relative;}
  .ex-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .ex-edit-grid label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;}
  .ex-edit-grid input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px;font-size:13px;color:var(--text);}
  .del-x{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;}
  nav.bottom{
    position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10;
  }
  nav.bottom button{
    flex:1;background:none;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--muted);font-size:10.5px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.03em;font-weight:600;
  }
  nav.bottom button.active{color:var(--accent);}
  nav.bottom button svg{width:20px;height:20px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}
  .session-card{cursor:pointer;}
  .session-card .row-between b{font-size:14px;}
  .session-card .row-between span{font-size:12px;color:var(--muted);}
  .status-line{display:flex;align-items:center;gap:8px;justify-content:center;}
  .status-line svg{width:18px;height:18px;color:var(--green);}
  .status-line span{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.03em;}
  .rest-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--accent);color:#fff;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:none;align-items:center;justify-content:space-between;z-index:20;
    max-width:480px;margin:0 auto;
  }
  .rest-info{display:flex;flex-direction:column;}
  .rest-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
  .rest-time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .rest-actions{display:flex;gap:8px;}
  .rest-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;}
  textarea{font-family:inherit;}
  .file-input{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<div id="restBar" class="rest-bar">
  <div class="rest-info"><span class="rest-label">Descanso</span><span class="rest-time" id="restTimeDisplay">00:00</span></div>
  <div class="rest-actions">
    <button class="rest-btn" id="restExtendBtn">+15s</button>
    <button class="rest-btn" id="restSkipBtn">Saltar</button>
  </div>
</div>
<input type="file" id="importFile" class="file-input" accept="application/json">
<script>
(function(){
"use strict";

var STORAGE_KEY = "gymTrackerV1";

var MUSCLE_COLORS = {
  "Pecho":"#b5651d","Espalda":"#3a6ea5","Cuádriceps":"#3f8f6d","Isquiotibiales":"#2f7460",
  "Glúteos":"#a64d63","Hombros":"#6a5b95","Bíceps":"#b08d2e","Tríceps":"#b06a3a",
  "Abdomen":"#3f8c96","Pantorrillas":"#767b85","General":"#7a7d84"
};
function muscleColor(m){ return MUSCLE_COLORS[m] || "#7a7d84"; }
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function ex(name,muscle,sets,repRange,rir,note,noteLabel){
  return {id:uid(),name:name,muscle:muscle,sets:sets,repRange:repRange,rir:rir,note:note||"",noteLabel:noteLabel||""};
}

var ICONS = {
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M6.5 9h-2a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2M17.5 9h2a1 1 0 0 0 1 1v4a1 1 0 0 0-1 1h-2M9 12h6"/>',
  history: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'
};
function icon(name){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
}

function estimate1RM(w,r){ return w*(1+r/30); }
function getBestEstimate(name, excludeSessionId){
  var best = 0;
  state.sessions.forEach(function(s){
    if(s.id===excludeSessionId) return;
    s.entries.forEach(function(e){
      if(e.name===name){
        e.sets.forEach(function(st){
          var w = parseFloat(st.weight), r = parseFloat(st.reps);
          if(!isNaN(w) && !isNaN(r) && r>0){
            var v = estimate1RM(w,r);
            if(v>best) best = v;
          }
        });
      }
    });
  });
  return best;
}

function defaultRoutines(){
  return [
    { id:uid(), name:"FullBody", exercises:[
      ex("Hipthrust en máquina","Glúteos",2,"10-12",2),
      ex("Prensa unilateral","Cuádriceps",2,"10-12",2),
      ex("Press plano en smith","Pecho",2,"8-10",2),
      ex("Remo sentado con cables","Espalda",2,"12-14",2),
      ex("Pulldown dorsal unilateral","Espalda",2,"10-12",2),
      ex("Extensión de tríceps cruzada unilateral con cuff","Tríceps",3,"10-12",2)
    ]},
    { id:uid(), name:"Upper A", exercises:[
      ex("Press plano en máquina","Pecho",2,"8-10",2),
      ex("Press inclinado bajo con mancuernas","Pecho",2,"10-12",2,"Peso en libras","Setup"),
      ex("Remo pecho apoyado con mancuernas","Espalda",2,"10-12",2),
      ex("Curl de bicep standaway con o sin banco","Bíceps",3,"10-12",2),
      ex("Vuelo lateral acostado con cables con cuffs","Hombros",3,"10-12",2)
    ]},
    { id:uid(), name:"Upper B", exercises:[
      ex("Leg raises","Abdomen",2,"AMRAP",2,"Superset con Plancha","Coach"),
      ex("Plancha","Abdomen",2,"AMRAP",2,"Anotar segundos como repeticiones","Coach"),
      ex("Press inclinado bajo en smith","Pecho",2,"8-10",2),
      ex("Pulldown bilateral","Espalda",2,"10-12",2),
      ex("Remo dorsal unilateral","Espalda",2,"12-14",2),
      ex("Curl de bicep predicador unilateral en máquina","Bíceps",3,"10-12",2),
      ex("Extensión de tríceps sobre la cabeza con cuff","Tríceps",3,"10-12",2),
      ex("Vuelo lateral unilateral en cable con cuff","Hombros",3,"10-12",2),
      ex("Calf raise en prensa","Pantorrillas",3,"10-12",2),
      ex("Vuelo posterior en máquina","Hombros",3,"10-12",2)
    ]},
    { id:uid(), name:"Lower", exercises:[
      ex("Cable crunch con cable","Abdomen",2,"10-12",2,"Superset con plancha lateral","Coach"),
      ex("Plancha lateral","Abdomen",2,"AMRAP",2,"Anotar segundos como repeticiones","Coach")
    ]}
  ];
}

function defaultState(){
  return { routines: defaultRoutines(), sessions: [], activeSession: null, view:"home", editingRoutine:null, lastSessionId:null };
}

var state = loadState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    if(!parsed.routines || !parsed.sessions) return defaultState();
    parsed.view = "home"; parsed.editingRoutine = null;
    return parsed;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

var timerInterval = null;

function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"}) + " · " + d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
}
function fmtElapsed(ms){
  var s = Math.floor(ms/1000);
  var m = Math.floor(s/60); s = s%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}

function computeTotals(session){
  var totalSets=0, totalVolume=0, muscle={};
  session.entries.forEach(function(entry){
    var planned = entry.plannedSets || entry.sets.length;
    if(!muscle[entry.muscle]) muscle[entry.muscle] = {done:0, planned:0};
    muscle[entry.muscle].planned += planned;
    entry.sets.forEach(function(s){
      var w = parseFloat(s.weight), r = parseFloat(s.reps);
      if(!isNaN(w) && !isNaN(r) && r>0){
        totalSets++;
        totalVolume += w*r;
        muscle[entry.muscle].done++;
      }
    });
  });
  return {totalSets:totalSets, totalVolume:totalVolume, muscle:muscle};
}

function getLastPerformance(name, excludeId){
  for(var i=0;i<state.sessions.length;i++){
    var s = state.sessions[i];
    if(s.id===excludeId) continue;
    var found = null;
    for(var j=0;j<s.entries.length;j++){ if(s.entries[j].name===name){ found=s.entries[j]; break; } }
    if(found) return {date:s.date, sets:found.sets};
  }
  return null;
}

function startWorkout(routineId){
  var routine = state.routines.find(function(r){return r.id===routineId;});
  if(!routine) return;
  if(state.activeSession){
    if(!confirm("Ya existe un entrenamiento en curso (" + state.activeSession.routineName + "). ¿Deseas descartarlo y comenzar uno nuevo?")) return;
  }
  var session = {
    id: uid(), routineId: routine.id, routineName: routine.name,
    date: new Date().toISOString(), startedAt: Date.now(), finishedAt:null, durationMin:null,
    entries: routine.exercises.map(function(e){
      return {
        exerciseId:e.id, name:e.name, muscle:e.muscle, repRange:e.repRange, rir:e.rir,
        note:e.note||"", noteLabel:e.noteLabel||"", plannedSets:e.sets,
        sets: Array.from({length:e.sets}, function(){ return {weight:"",reps:"",rir:""}; })
      };
    })
  };
  state.activeSession = session;
  state.view = "workout";
  saveState(); render();
}

function finishWorkout(){
  if(!confirm("¿Finalizar y registrar este entrenamiento?")) return;
  stopRest();
  var session = state.activeSession;
  session.finishedAt = Date.now();
  session.durationMin = Math.max(1, Math.round((session.finishedAt - session.startedAt)/60000));
  state.sessions.unshift(session);
  state.activeSession = null;
  state.lastSessionId = session.id;
  state.view = "sessionSummary";
  saveState(); render();
}

function cancelWorkout(){
  if(!confirm("¿Descartar este entrenamiento sin registrarlo?")) return;
  stopRest();
  state.activeSession = null;
  state.view = "home";
  saveState(); render();
}

// ---------- rest timer (independent of main render cycle) ----------

var restState = { active:false, endsAt:0, duration:90 };
var restInterval = null;
var restBarEl, restTimeEl;

function startRest(seconds){
  restState.duration = seconds;
  restState.endsAt = Date.now() + seconds*1000;
  restState.active = true;
  restBarEl.style.display = "flex";
  if(restInterval) clearInterval(restInterval);
  restTick();
  restInterval = setInterval(restTick, 1000);
}
function stopRest(){
  restState.active = false;
  if(restBarEl) restBarEl.style.display = "none";
  if(restInterval){ clearInterval(restInterval); restInterval = null; }
}
function restTick(){
  var remaining = Math.max(0, Math.round((restState.endsAt - Date.now())/1000));
  restTimeEl.textContent = fmtElapsed(remaining*1000);
  if(remaining<=0){
    if(restInterval){ clearInterval(restInterval); restInterval=null; }
    beep();
    setTimeout(stopRest, 1500);
  }
}
function beep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(function(){ o.stop(); ctx.close(); }, 300);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

// ---------- render helpers ----------

function renderMuscleChips(routine){
  var set = {};
  routine.exercises.forEach(function(e){ set[e.muscle]=true; });
  return Object.keys(set).map(function(m){
    return '<span class="chip" style="background:'+muscleColor(m)+'">'+m+'</span>';
  }).join("");
}

function renderRoutineCard(r){
  return '' +
  '<div class="card routine-card">' +
    '<div class="info">' +
      '<h3>'+r.name+'</h3>' +
      '<div class="meta">'+r.exercises.length+' ejercicios</div>' +
      '<div class="chips">'+renderMuscleChips(r)+'</div>' +
    '</div>' +
    '<button class="icon-btn" data-action="edit-routine" data-routine="'+r.id+'">'+icon('edit')+'</button>' +
    '<button class="btn small" data-action="start-workout" data-routine="'+r.id+'">Iniciar</button>' +
  '</div>';
}

function renderHome(){
  var banner = "";
  if(state.activeSession){
    banner = '<div class="banner">' +
      '<div><b>Entrenamiento en curso</b><span>'+state.activeSession.routineName+'</span></div>' +
      '<button class="btn secondary" style="background:#fff;color:var(--accent-dark)" data-action="goto" data-view="workout">Continuar</button>' +
    '</div>';
  }
  var cards = state.routines.map(renderRoutineCard).join("");
  return banner +
    '<div class="section-title">Rutinas</div>' +
    cards +
    '<button class="btn secondary block" data-action="add-routine" style="margin-top:6px;">+ Nueva rutina</button>';
}

function renderSetRow(entry, entryIdx, setIdx, set, readonly, prBaseline){
  var done = (set.weight!=="" && set.reps!=="") ? " done" : "";
  var w = parseFloat(set.weight), r = parseFloat(set.reps);
  var isPR = prBaseline>0 && !isNaN(w) && !isNaN(r) && r>0 && estimate1RM(w,r) > prBaseline;
  var prBadge = isPR ? '<div class="pr-badge">★ Récord personal</div>' : "";
  if(readonly){
    return '<div class="set-row'+done+'">' +
      '<div class="snum">S'+(setIdx+1)+'</div>' +
      '<div style="text-align:center;font-size:14px;">'+(set.weight||"—")+'kg</div>' +
      '<div style="text-align:center;font-size:14px;">'+(set.reps||"—")+'</div>' +
      '<div style="text-align:center;font-size:14px;">'+(set.rir!==""&&set.rir!==undefined?"@"+set.rir:"—")+'</div>' +
      '<div></div>' +
    '</div>' + prBadge;
  }
  return '<div class="set-row'+done+'">' +
    '<div class="snum">S'+(setIdx+1)+'</div>' +
    '<input inputmode="decimal" placeholder="kg" data-role="set-weight" data-entry="'+entryIdx+'" data-set="'+setIdx+'" value="'+(set.weight||"")+'">' +
    '<input inputmode="numeric" placeholder="reps" data-role="set-reps" data-entry="'+entryIdx+'" data-set="'+setIdx+'" value="'+(set.reps||"")+'">' +
    '<input inputmode="decimal" placeholder="RIR" data-role="set-rir" data-entry="'+entryIdx+'" data-set="'+setIdx+'" value="'+(set.rir||"")+'">' +
    '<button class="rm" data-action="remove-set" data-entry="'+entryIdx+'" data-set="'+setIdx+'">×</button>' +
  '</div>' + prBadge;
}

function renderExerciseCard(entry, idx, sessionId, readonly){
  var target = (entry.repRange?entry.repRange+" reps":"") + (entry.rir!==""&&entry.rir!==undefined?" · "+entry.rir+" RIR":"");
  var nameHtml;
  if(entry.name===""){
    nameHtml = '<input class="ghost name-input" placeholder="Nombre del ejercicio" data-role="entry-name" data-entry="'+idx+'" value="">' +
      '<input class="ghost" placeholder="Grupo muscular" data-role="entry-muscle" data-entry="'+idx+'" value="'+entry.muscle+'">';
  } else {
    nameHtml = '<div class="exercise-name" data-action="view-progress" data-name="'+encodeURIComponent(entry.name)+'">'+entry.name+'</div>' +
      '<div class="exercise-target">'+entry.plannedSets+'s · '+target+'</div>';
  }
  var note = entry.note ? '<div class="note">'+(entry.noteLabel?entry.noteLabel+" · ":"")+entry.note+'</div>' : "";
  var prevHtml = "";
  var prBaseline = entry.name ? getBestEstimate(entry.name, sessionId) : 0;
  if(!readonly && entry.name){
    var prev = getLastPerformance(entry.name, sessionId);
    if(prev){
      prevHtml = '<div class="prev"><span>Anterior ('+fmtDate(prev.date).split(" · ")[0]+'): ' +
        prev.sets.map(function(s){ return (s.weight||"–")+"kg×"+(s.reps||"–")+(s.rir!==""&&s.rir!==undefined?" @"+s.rir:""); }).join(" · ") +
      '</span><button class="fill-btn" data-action="fill-previous" data-entry="'+idx+'">Usar</button></div>';
    }
  }
  var labels = readonly ? "" : '<div class="field-labels"><div></div><div>Peso</div><div>Reps</div><div>RIR</div><div></div></div>';
  var rows = entry.sets.map(function(s,si){ return renderSetRow(entry, idx, si, s, readonly, prBaseline); }).join("");
  var addBtn = readonly ? "" : '<button class="addset" data-action="add-set" data-entry="'+idx+'">+ Añadir serie</button>';
  var chip = '<span class="chip" style="background:'+muscleColor(entry.muscle)+'">'+entry.muscle+'</span>';
  return '<div class="card exercise-card">' +
    '<div class="exercise-head"><div>'+nameHtml+'</div>'+chip+'</div>' +
    note + prevHtml + labels + rows + addBtn +
  '</div>';
}

function renderWorkout(){
  var s = state.activeSession;
  if(!s){ state.view="home"; return renderHome(); }
  var cards = s.entries.map(function(entry, idx){ return renderExerciseCard(entry, idx, s.id, false); }).join("");
  return cards +
    '<button class="btn secondary block" data-action="add-exercise" style="margin:6px 0 16px;">+ Agregar ejercicio</button>' +
    '<button class="btn block" data-action="finish-workout" style="margin-bottom:10px;">Finalizar entrenamiento</button>' +
    '<button class="btn danger block" data-action="cancel-workout">Descartar entrenamiento</button>';
}

function renderSessionDetail(session, isSummary){
  var totals = computeTotals(session);
  var cards = session.entries.map(function(entry, idx){ return renderExerciseCard(entry, idx, session.id, true); }).join("");
  var muscleRows = Object.keys(totals.muscle).map(function(m){
    var mm = totals.muscle[m];
    return '<div class="muscle-row"><span>'+m+'</span><b>'+mm.done+'/'+mm.planned+'</b></div>';
  }).join("");
  var head = isSummary ? '<div class="card"><div class="status-line">'+icon('check')+'<span>Entrenamiento registrado</span></div></div>' : "";
  return head +
  '<div class="card">' +
    '<div class="row-between"><b>'+session.routineName+'</b><span style="color:var(--muted);font-size:12px;">'+fmtDate(session.date)+'</span></div>' +
    '<div class="totals-grid">' +
      '<div class="stat"><b>'+totals.totalSets+'</b><span>series</span></div>' +
      '<div class="stat"><b>'+Math.round(totals.totalVolume).toLocaleString()+' kg</b><span>volumen</span></div>' +
      '<div class="stat"><b>'+(session.durationMin||"–")+' min</b><span>duración</span></div>' +
      '<div class="stat"><b>'+session.entries.length+'</b><span>ejercicios</span></div>' +
    '</div>' +
  '</div>' +
  '<div class="card"><div class="section-title" style="margin-top:0;">Por músculo</div>'+muscleRows+'</div>' +
  cards +
  (isSummary ? '<button class="btn block" data-action="goto" data-view="home">Volver a inicio</button>' :
    '<button class="btn danger block" data-action="delete-session" data-session="'+session.id+'">Eliminar registro</button>');
}

function renderHistory(){
  if(state.sessions.length===0) return '<div class="empty">Aún no hay entrenamientos registrados.</div>';
  var byRoutine = {};
  var order = [];
  state.sessions.forEach(function(s){
    if(!byRoutine[s.routineName]){ byRoutine[s.routineName]=[]; order.push(s.routineName); }
    byRoutine[s.routineName].push(s);
  });
  return order.map(function(name){
    var items = byRoutine[name].map(function(s){
      var t = computeTotals(s);
      return '<div class="card session-card" data-action="view-session" data-session="'+s.id+'">' +
        '<div class="row-between"><b>'+fmtDate(s.date)+'</b><span>'+(s.durationMin||"–")+' min</span></div>' +
        '<div class="meta" style="color:var(--muted);font-size:12px;margin-top:4px;">'+t.totalSets+' series · '+Math.round(t.totalVolume).toLocaleString()+' kg</div>' +
      '</div>';
    }).join("");
    return '<div class="section-title">'+name+'</div>'+items;
  }).join("");
}

function buildProgressChart(points){
  if(points.length<2) return "";
  var w=311, h=110, padX=8, padY=16;
  var vals = points.map(function(p){return p.value;});
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min===max){ min = min-1; max = max+1; }
  var stepX = (w-padX*2)/(points.length-1);
  function y(v){ return h-padY - ((v-min)/(max-min))*(h-padY*2); }
  var linePts = points.map(function(p,i){ return (padX+i*stepX).toFixed(1)+","+y(p.value).toFixed(1); }).join(" ");
  var dots = points.map(function(p,i){
    var x=(padX+i*stepX).toFixed(1), yy=y(p.value).toFixed(1);
    return '<circle cx="'+x+'" cy="'+yy+'" r="3" style="fill:var(--accent)"/>';
  }).join("");
  var lastX = padX+(points.length-1)*stepX;
  var lastY = y(points[points.length-1].value);
  var lastLabel = '<text x="'+lastX+'" y="'+(lastY-8)+'" font-size="11" style="fill:var(--accent)" text-anchor="end" font-weight="700">'+Math.round(points[points.length-1].value)+' kg</text>';
  return '<div class="card"><div class="section-title" style="margin-top:0;">Progreso (peso máximo por sesión)</div>' +
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;overflow:visible;">' +
      '<line x1="'+padX+'" y1="'+(h-padY)+'" x2="'+(w-padX)+'" y2="'+(h-padY)+'" style="stroke:var(--border)" stroke-width="1"/>' +
      '<polyline points="'+linePts+'" fill="none" style="stroke:var(--accent)" stroke-width="2"/>' +
      dots + lastLabel +
    '</svg></div>';
}

function renderExerciseProgress(name){
  var rows = [];
  var chartPoints = [];
  var chronological = state.sessions.slice().reverse();
  chronological.forEach(function(s){
    var e = s.entries.find(function(en){ return en.name===name; });
    if(e){
      var best = 0;
      e.sets.forEach(function(st){ var w=parseFloat(st.weight); if(!isNaN(w) && w>best) best=w; });
      if(best>0) chartPoints.push({date:s.date, value:best});
    }
  });
  state.sessions.forEach(function(s){
    s.entries.forEach(function(e){
      if(e.name===name) rows.push({date:s.date, sets:e.sets});
    });
  });
  if(state.activeSession){
    state.activeSession.entries.forEach(function(e){
      if(e.name===name) rows.unshift({date:state.activeSession.date, sets:e.sets, current:true});
    });
  }
  var chartHtml = buildProgressChart(chartPoints);
  if(rows.length===0) return chartHtml + '<div class="empty">Sin historial registrado para '+name+'.</div>';
  var list = rows.map(function(r){
    var setsHtml = r.sets.filter(function(s){return s.weight!==""||s.reps!=="";}).map(function(s){
      return '<div class="muscle-row"><span>'+(s.weight||"–")+' kg × '+(s.reps||"–")+' reps</span><b>'+(s.rir!==""&&s.rir!==undefined?"@"+s.rir:"")+'</b></div>';
    }).join("");
    return '<div class="card"><div class="row-between"><b>'+fmtDate(r.date)+'</b>'+(r.current?'<span style="color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;">En curso</span>':'')+'</div>'+(setsHtml||'<div class="meta" style="color:var(--muted);font-size:12px;">Sin datos</div>')+'</div>';
  }).join("");
  return chartHtml + list;
}

      '<div class="ex-edit-grid">' +
        '<div><label>Músculo</label><input data-role="ex-muscle" data-routine="'+r.id+'" data-exercise="'+e.id+'" value="'+e.muscle+'"></div>' +
        '<div><label>Series</label><input inputmode="numeric" data-role="ex-sets" data-routine="'+r.id+'" data-exercise="'+e.id+'" value="'+e.sets+'"></div>' +
        '<div><label>Rango reps</label><input data-role="ex-reprange" data-routine="'+r.id+'" data-exercise="'+e.id+'" value="'+e.repRange+'"></div>' +
        '<div><label>RIR</label><input inputmode="decimal" data-role="ex-rir" data-routine="'+r.id+'" data-exercise="'+e.id+'" value="'+e.rir+'"></div>' +
      '</div>' +
      '<div style="margin-top:8px;"><label style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;">Nota (opcional)</label><input class="ghost" data-role="ex-note" data-routine="'+r.id+'" data-exercise="'+e.id+'" value="'+e.note+'" placeholder="Ej: Superset con..."></div>' +
    '</div>';
  }).join("");

// ---------- main render ----------

function headerFor(view){
  var title = "Mi Entrenamiento", left = "", right = "";
  if(view==="home"){ title="Mi Entrenamiento"; }
  else if(view==="workout"){
    title = state.activeSession ? state.activeSession.routineName : "Entrenamiento";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="home">‹</button>';
    right = '<span class="timer" id="timerDisplay">00:00</span>';
  } else if(view==="history"){ title="Historial"; }
  else if(view==="sessionDetail"){
    title = "Detalle";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="history">‹</button>';
  } else if(view==="sessionSummary"){
    title = "Resumen";
  } else if(view==="exerciseProgress"){
    title = state.progressExercise ? decodeURIComponent(state.progressExercise) : "Progreso";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="back">‹</button>';
  } else if(view==="editRoutine"){
    title = "Editar rutina";
    left = '<button class="icon-btn chevron" data-action="goto" data-view="home">‹</button>';
  } else if(view==="data"){ title="Datos"; }
  return '<header class="top">'+left+'<h1>'+title+'</h1>'+right+'</header>';
}

function bottomNavFor(view){
  var active = (view==="home"||view==="editRoutine") ? "home" : (view==="history"||view==="sessionDetail"||view==="exerciseProgress") ? "history" : (view==="data") ? "data" : "";
  function cls(v){ return v===active ? "active" : ""; }
  if(view==="workout" || view==="sessionSummary") return "";
  return '<nav class="bottom">' +
    '<button class="'+cls("home")+'" data-action="goto" data-view="home">'+icon('dumbbell')+'Rutinas</button>' +
    '<button class="'+cls("history")+'" data-action="goto" data-view="history">'+icon('history')+'Historial</button>' +
    '<button class="'+cls("data")+'" data-action="goto" data-view="data">'+icon('save')+'Datos</button>' +
  '</nav>';
}

function render(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  var body = "";
  switch(state.view){
    case "home": body = renderHome(); break;
    case "workout": body = renderWorkout(); break;
    case "history": body = renderHistory(); break;
    case "sessionDetail":
      var sd = state.sessions.find(function(s){return s.id===state.viewingSession;});
      body = sd ? renderSessionDetail(sd,false) : '<div class="empty">No encontrado.</div>';
      break;
    case "sessionSummary":
      var ss = state.sessions.find(function(s){return s.id===state.lastSessionId;});
      body = ss ? renderSessionDetail(ss,true) : '<div class="empty">No encontrado.</div>';
      break;
    case "exerciseProgress": body = renderExerciseProgress(decodeURIComponent(state.progressExercise||"")); break;
    case "editRoutine": body = renderEditRoutine(state.editingRoutine); break;
    case "data": body = renderData(); break;
    default: body = renderHome();
  }
  document.getElementById("app").innerHTML = headerFor(state.view) + "<main>" + body + "</main>" + bottomNavFor(state.view);
  if(state.view!=="workout") stopRest();
  if(state.view==="workout" && state.activeSession){
    var disp = document.getElementById("timerDisplay");
    function tick(){ if(disp) disp.textContent = fmtElapsed(Date.now()-state.activeSession.startedAt); }
    tick();
    timerInterval = setInterval(tick, 1000);
  }
}

// ---------- event delegation ----------

var app = document.getElementById("app");

app.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.dataset.action;

  if(action==="goto"){
    var v = t.dataset.view;
    if(v==="back"){ state.view = state.activeSession ? "workout" : "history"; }
    else state.view = v;
    render(); return;
  }
  if(action==="start-workout"){ startWorkout(t.dataset.routine); return; }
  if(action==="finish-workout"){ finishWorkout(); return; }
  if(action==="cancel-workout"){ cancelWorkout(); return; }
  if(action==="add-set"){
    var idx = +t.dataset.entry;
    state.activeSession.entries[idx].sets.push({weight:"",reps:"",rir:""});
    saveState(); render(); return;
  }
  if(action==="remove-set"){
    var ei=+t.dataset.entry, si=+t.dataset.set;
    state.activeSession.entries[ei].sets.splice(si,1);
    if(state.activeSession.entries[ei].sets.length===0) state.activeSession.entries[ei].sets.push({weight:"",reps:"",rir:""});
    saveState(); render(); return;
  }
  if(action==="fill-previous"){
    var fi = +t.dataset.entry;
    var entry = state.activeSession.entries[fi];
    var prev = getLastPerformance(entry.name, state.activeSession.id);
    if(prev){
      entry.sets = prev.sets.map(function(s){ return {weight:s.weight, reps:s.reps, rir:s.rir}; });
      entry.plannedSets = Math.max(entry.plannedSets, entry.sets.length);
    }
    saveState(); render(); return;
  }
  if(action==="add-exercise"){
    state.activeSession.entries.push({exerciseId:uid(),name:"",muscle:"General",repRange:"",rir:"",note:"",noteLabel:"",plannedSets:3,sets:[{weight:"",reps:"",rir:""},{weight:"",reps:"",rir:""},{weight:"",reps:"",rir:""}]});
    saveState(); render(); return;
  }
  if(action==="view-progress"){
    state.progressExercise = t.dataset.name;
    state.view = "exerciseProgress";
    render(); return;
  }
  if(action==="view-session"){
    state.viewingSession = t.dataset.session;
    state.view = "sessionDetail";
    render(); return;
  }
  if(action==="delete-session"){
    if(!confirm("¿Eliminar este entrenamiento del historial?")) return;
    state.sessions = state.sessions.filter(function(s){return s.id!==t.dataset.session;});
    state.view = "history";
    saveState(); render(); return;
  }
  if(action==="edit-routine"){
    state.editingRoutine = t.dataset.routine;
    state.view = "editRoutine";
    render(); return;
  }
  if(action==="add-routine"){
    var nr = {id:uid(), name:"Nueva rutina", exercises:[]};
    state.routines.push(nr);
    state.editingRoutine = nr.id;
    state.view = "editRoutine";
    saveState(); render(); return;
  }
  if(action==="remove-routine"){
    if(!confirm("¿Eliminar esta rutina completa?")) return;
    state.routines = state.routines.filter(function(r){return r.id!==t.dataset.routine;});
    state.view = "home";
    saveState(); render(); return;
  }
  if(action==="add-exercise-to-routine"){
    var routine = state.routines.find(function(r){return r.id===t.dataset.routine;});
    routine.exercises.push({id:uid(),name:"",muscle:"General",sets:3,repRange:"10-12",rir:2,note:"",noteLabel:""});
    saveState(); render(); return;
  }
  if(action==="remove-exercise"){
    var routine2 = state.routines.find(function(r){return r.id===t.dataset.routine;});
    routine2.exercises = routine2.exercises.filter(function(e){return e.id!==t.dataset.exercise;});
    saveState(); render(); return;
  }
  if(action==="export-data"){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "entrenamiento-backup-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return;
  }
  if(action==="import-data"){
    document.getElementById("importFile").click();
    return;
  }
});

app.addEventListener("input", function(e){
  var t = e.target;
  var role = t.dataset.role;
  if(!role) return;

  if(role==="set-weight" || role==="set-reps" || role==="set-rir"){
    var ei=+t.dataset.entry, si=+t.dataset.set;
    var field = role==="set-weight"?"weight":role==="set-reps"?"reps":"rir";
    var entry = state.activeSession.entries[ei];
    entry.sets[si][field] = t.value;
    var row = t.closest(".set-row");
    var set = entry.sets[si];
    var wasDone = row.classList.contains("done");
    row.classList.toggle("done", set.weight!=="" && set.reps!=="");
    if(!wasDone && row.classList.contains("done")){ startRest(restState.duration); }
    var pw = parseFloat(set.weight), pr = parseFloat(set.reps);
    var baseline = entry.name ? getBestEstimate(entry.name, state.activeSession.id) : 0;
    var isPR = baseline>0 && !isNaN(pw) && !isNaN(pr) && pr>0 && estimate1RM(pw,pr) > baseline;
    var nextEl = row.nextElementSibling;
    var hasBadge = nextEl && nextEl.classList && nextEl.classList.contains("pr-badge");
    if(isPR && !hasBadge){
      var badge = document.createElement("div");
      badge.className = "pr-badge";
      badge.textContent = "★ Récord personal";
      row.insertAdjacentElement("afterend", badge);
    } else if(!isPR && hasBadge){
      nextEl.remove();
    }
    saveState(); return;
  }
  if(role==="entry-name"){ state.activeSession.entries[+t.dataset.entry].name = t.value; saveState(); return; }
  if(role==="entry-muscle"){ state.activeSession.entries[+t.dataset.entry].muscle = t.value || "General"; saveState(); return; }

  if(role==="routine-name"){
    var r = state.routines.find(function(x){return x.id===t.dataset.routine;});
    r.name = t.value; saveState(); return;
  }
  if(role && role.indexOf("ex-")===0){
    var r2 = state.routines.find(function(x){return x.id===t.dataset.routine;});
    var e2 = r2.exercises.find(function(x){return x.id===t.dataset.exercise;});
    if(role==="ex-name") e2.name = t.value;
    else if(role==="ex-muscle") e2.muscle = t.value || "General";
    else if(role==="ex-sets") e2.sets = Math.max(1, parseInt(t.value)||1);
    else if(role==="ex-reprange") e2.repRange = t.value;
    else if(role==="ex-rir") e2.rir = t.value;
    else if(role==="ex-note") e2.note = t.value;
    saveState(); return;
  }
});

document.getElementById("importFile").addEventListener("change", function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!parsed.routines || !parsed.sessions) throw new Error("formato inválido");
      if(!confirm("Esto reemplazará todos tus datos actuales con los del archivo. ¿Continuar?")) return;
      state = parsed;
      state.view = "home"; state.editingRoutine = null; state.activeSession = state.activeSession || null;
      saveState(); render();
      alert("Datos importados correctamente.");
    }catch(err){
      alert("No se pudo leer el archivo. Verifica que sea un respaldo válido.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

restBarEl = document.getElementById("restBar");
restTimeEl = document.getElementById("restTimeDisplay");
document.getElementById("restExtendBtn").addEventListener("click", function(){ restState.endsAt += 15000; restTick(); });
document.getElementById("restSkipBtn").addEventListener("click", stopRest);

render();
})();
</script>
</body>
